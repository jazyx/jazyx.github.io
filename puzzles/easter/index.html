<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Easter Eggs</title>
  <meta name="viewport" content="width = device-width, initial-scale = 1.0, user-scalable=no">
  <style>
    html, body {
      margin:0;
      padding:0;
      overflow:hidden;
      height: 100%;
      background:#000;
      text-align:center;  
      font-family:"Verdana";
      line-height: 0;
    }
    body * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    main {
      position:absolute;
      width:100vmin;
      height:100vmin;
      left:50%;
      top:50%;
      margin-left:-50vmin;
      margin-top:-50vmin;
      color:#fff;

      /*background:#222;*/
    }

    .touched main {
      background:#111;
    }

    .square {
      position: absolute;
      text-align: left;
      width: 33%;
      height: 33%;
    }
    .square svg{
      width: 100%;
      height: 100%;
    }
    main>.row0 {
      top: 0;
    }
    main>.row1 {
      top: 33.3%;
    }
    main>.row2 {
      top: 66.7%;
    }
    main>.col0 {
      left: 0;
    }
    main>.col1 {
      left: 33.3%;
    }
    main>.col2 {
      left: 66.7%;
    }
    div[class*= size-] > div {
      position:relative;
    }
    .size-0>div {
      width:100%;
      height:100%;
    }
    .size-1>div {
      width:90%;
      height:90%;
      left: 25%;
    }
    .size-2>div {
      width:80%;
      height:80%;
      left: 30%;
      top: 15%;
    }
    .size-3>div {
      width:70%;
      height:70%;
      left: 0%;
      top: 25%;
    }
    .size-4>div {
      width:60%;
      height:60%;
      left: 50%;
    }
    .size-5>div {
      width:50%;
      height:50%;
      left: 50%;
      top: 20%;
    }
    .size-6>div {
      width:40%;
      height:40%;
      top: 50%;
    }
    .size-7>div {
      width:30%;
      height:30%;
      left: 70%;
      top: 30%;
    }

    .letter {
      opacity: 1;
    }
    .yolk{
      position: absolute;
      top: 15%;
      left: 21%;
      width: 58%;
      height: 78%;
      border-radius: 500px;
    }
    .found .yolk,
    .glow .yolk{
      background-color:#666;
    
      box-shadow: 0px 0px 50px #ccc;
      -moz-box-shadow: 0px 0px 50px  #ccc;
      -webkit-box-shadow: 0px 0px 50px  #ccc;
      -o-box-shadow: 0px 0px 50px  #ccc;
    }

    .glow .yolk{
      background-color:#fff;
    }
    .circle{
      position: absolute;
      top: 28.7%;
      left: 21.5%;
      width: 57%;
      height: 57%;
      border-radius: 500px;
      background-color: #666;
      opacity: 0.95;
    }

    .square.drag {
       z-index: 1;
    }
 
    .square.draggable use,
    .square.draggable .circle,
    #anagrams use.draggable {
      cursor:pointer;
    }
    #anagrams use.draggable {
      fill: #fff;
    }
    .square:not(.found) .circle{
      opacity: 0;
    }
    svg {
      position: absolute;
    }
    .portal use {      
      fill: #fff;
    }

    .fullwidth {
      width: 150%;
      height: 150%;
      left: -25% !important;
      top: -75% !important;
    }
    #anagram { 
      position: absolute;
      top: 52%;
      left: 17%;
      width: 70%;
      height: 16%;
      display:none;
      /*background-color: #600;*/
    }
    .anagram #anagram { 
      display:block;
    }
    #anagram>div{ 
      position: relative;
      display: inline-block;
      height: 100%;
      width: 18%;
      margin: -3.1%;
    }
    #anagram use{ 
      fill: #000;
    }
    #anagram .glow .yolk{
      background-color: transparent;
    
      box-shadow: none;
      -moz-box-shadow: none;
      -webkit-box-shadow: none;
      -o-box-shadow: none;
    }

    .fullwidth #anagram use {
      fill: #fff;
      pointer-events:none;
    }
    .fullwidth > svg > use {
      fill: #000;
    }
    div:not(.fullwidth) #anagrams  {
      display:none;
    }
    #anagrams svg  {
      height: 63%;
      top: 67%;
      left: -3.7%;
    }

    .fullwidth g use,
    .flip #anagram use {
      fill: #000;
      stroke: #fff;
      stroke-width: 2;
    }

    #tomorrow {
      position: absolute;
      top: -200%;
      width: 100%;
      height: 500%;
      background: #000;
      font-size: 16px;
      opacity: 1;
      transition: opacity 2s ease-in-out;
    }
    #tomorrow p {
      position: absolute;
      top:50%;
      left: 0;
      width: 100%;
      cursor: default;
    }
    #tomorrow.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .portal.drop #anagram,
    .portal.drop #anagrams g:first-child use:nth-child(2),
    .portal.drop #anagrams g:first-child use:nth-last-child(2),
    .portal.drop #anagrams use:nth-child(1),
    .portal.drop #anagrams use:nth-last-child(1),
    .portal.drop #anagrams use:nth-child(8),
    .portal.drop #anagrams g:nth-child(2),
    .portal.drop #anagrams g:nth-child(3) {
      opacity: 0;     
      transition: opacity 2s ease-in-out;
    }
    /* Show rows for -EANTER- and -EGG---- */
    .portal.easter #anagrams g:nth-child(2) ,
    .portal.easter #anagrams g:nth-child(3) {
      opacity: 1;     
      transition: opacity 2s ease-in-out;
    }
    /* Cells in the rows above */
    .portal.easter #anagrams g:nth-child(2) use,
    .portal.easter #anagrams g:nth-child(3) use:nth-child(2),
    .portal.easter #anagrams g:nth-child(3) use:nth-child(3),
    .portal.easter #anagrams g:nth-child(3) use:nth-child(4){
      fill: #000;
    }
    .portal.easter #anagrams g:nth-child(1),
    .portal.easter #anagrams g:nth-child(3) use:nth-child(5),
    .portal.easter #anagrams g:nth-child(3) use:nth-child(6),
    .portal.easter #anagrams g:nth-child(3) use:nth-child(7){
      opacity: 0;
    }
    .portal.easter #anagrams g:nth-child(4) use:nth-last-child(1){
      opacity: 1;
    }

    .portal.easter #anagrams g use.placed {
      fill: #fff !important;
    }
    #anagrams g:nth-child(4) use.placed {
      display:none;
    }
    button {
      background-color: #000;
      color: #fff;
      border-radius: 60px;
      border-width: 2px;
      height: 60px;
      width: 60px;
      right: 0;
      bottom: 40%;
      position: absolute;
      font-size: 12px;
    }

    img {
      position: absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      opacity: 1;
      pointer-events: none;           
      transition: opacity 2s ease-in-out;
    }

    img.hidden {
      opacity: 0;
    }
  </style>

      var remaining = endMS - new Date()
      if (remaining > 0) {
        // We need to change the width gradually, otherwise the
        // SVG elements will immediately resize to fit the new width.
        // On iPhone, the last egg will flicker to the next line.
        var width = 150 - ((150 - 33.3) * remaining / duration) + "%"
        var height = 150 - ((150 - 33.3) * remaining / duration) + "%"
        var left = -25 - ((-25 - 33.3) * remaining / duration) + "%"
        var top = (-75 + (75 + 33.3) * remaining / duration) + "%"

        portalSquare.style.width = width
        portalSquare.style.left = left
        portalSquare.style.top = top
        portalSquare.style.height = height

        setTimeout(transition, 40)

      } else {     
        portalSquare.removeAttribute("style")
        portalSquare.classList.add("fullwidth")
        setSquaresDraggable(true)
      }
    })()

    ;(function resetEggs(){
      var eggs = document.querySelectorAll("#anagrams use")
      var total = eggs.length
      var ii
      
      for (ii = 0; ii < total; ii += 1) {
        egg = eggs[ii]
        egg.setAttributeNS(xlinkNS, "xlink:href", "#egg")
        egg.removeAttribute("transform")
        egg.classList.remove("draggable")
      }
    })()
  }

  function startAnagramDrag(dragData, egg) {
    var link = egg.getAttribute("xlink:href")
    dragData.link = link 
  }

  function stopAnagramDrag (dragData, overPortal, event) {
    var link = dragData.link
    var char = link.charAt(1).toLowerCase()
    var target = dragData.target
    var display = target.style.display 
    clientLoc = getClientLoc(event)

    target.style.display = "none" 
    var element = document.elementFromPoint(clientLoc.x, clientLoc.y)

    if (element.tagName.toLowerCase() === "use") {
      checkForCharDrop(element, link)
    }

    target.style.display = display

    function checkForCharDrop(element, link) {
      var column = getElementIndex(element)
      var row = getElementIndex(element.parentNode)
      var letters = anagramMap.letters[row]
      var staked = anagramMap.staked[column][char]
      var rows = anagramMap.rows
      var alternatives = rows[row]
      
      // Check if there is already a char in this cell
      if (letters[column]) {
        return
      }

      // Does this char match any of the possible words for this row?
      var noMatch = (function trimAlternatives(){
        var noMatch = false
        var matches = []
        var total = alternatives.length
          , ii

        for (ii = 0; ii < total; ii += 1) {
          if (alternatives[ii].charAt(column) === char) {
            matches.push(alternatives[ii])
          }
        }

        noMatch = !matches.length

        if (!noMatch) {
          // There is at least one match. Remove non-matching words
          // from this row
          ii = total
          for ( ; ii; ) {
            ii -= 1
            if (matches.indexOf(alternatives[ii]) < 0) {
              alternatives.splice(ii, 1)
            }
          }
        }

        return noMatch
      })()

      if (noMatch) {
        return
      }

      // Show that this letter can be used here
      element.setAttributeNS(xlinkNS, "xlink:href", link)
      checkList.push(0)

      if (checkList.length === 32) {
        // The last letter is in place
        return showFlip()
      }

      // Update model for anagrams
      staked.in.push(row)

      letters[column] = { 
        letter: char
      , words: staked.words
      }

      if (alternatives.length === 1) {
        setExclusivity(alternatives[0], row)
      } else {
        exclusiveSet(staked.words, alternatives, row)
      }

      function setExclusivity(word, index) {        
        var total = rows.length
        var ii

        for (ii = 0; ii < total; ii += 1) {
          if (ii !== index) {
            removeItemFromArray(rows[ii], word)
          }
        }
      }

      function exclusiveSet(set, alternatives, index) {
        var setOfSets = []
        var letters = anagramMap.letters      
        var rowCount = letters.length
        var setCount = 1
        var trimmedRows = []
        var ii
          , jj
          , row
          , letterCount
          , letterData
          , wordArray

        setOfSets[index] = set

        for (ii = 0; ii < rowCount; ii += 1) {

          if (ii !== index) {
            row = letters[ii]

            if (row) {
              letterCount = row.length
              for (jj = 0; jj < letterCount; jj += 1) {
                letterData = row[jj]

                if (letterData) { // may be undefined
                  wordArray = letterData.words

                  if (compareArrays(set, wordArray)) {
                    setOfSets[ii] = wordArray
                    setCount += 1

                    // skip any further sets in this row
                    jj = letterCount
                  }
                }
              }
            }
          }
        }

        if (setCount === set.length) {
          // n separate words are defined in n separate rows. They
          // must be in these rows, and they cannot be elsewhere
          ;(function exclusify() {       
            var total = rows.length
            var ii
              , row

            for (ii = 0; ii < total; ii += 1) {
              row = rows[ii]
              if (setOfSets[ii]) {
                removeExcessItems(ii, row, set)
              } else {
                deleteItemsFromArray(ii, row, set)
              }
            }

            total = trimmedRows.length
            if (total) {
              for (ii = 0; ii < total; ii += 1) {
                index = trimmedRows[ii]

                setExclusivity(rows[index][0], index)
              }
            }
          })()    
        }

        function removeExcessItems(index, array, itemsToRetain) {
          var initialCount = array.length
          var ii = initialCount
          var item
            , cut

          for (; ii; ) {
            ii -= 1
            item = array[ii]
            cut = itemsToRetain.indexOf(item) < 0
            if (cut) {
              array.splice(ii, 1)
            }
          }

          if (array.length === 1 && initialCount > 1) {
            trimmedRows.push(index)
          }
        }

        function deleteItemsFromArray(index, array, itemsToDelete) {
          var initialCount = array.length
          var total = itemsToDelete.length
          var ii

          for (ii = 0; ii < total; ii += 1) {
            removeItemFromArray(array, itemsToDelete[ii])
          }

          if (array.length === 1 && initialCount > 1) {
            trimmedRows.push(index)
          } 
        }
      }
    }

    function checkForCharIndex(column) {
      var matches = []

      for (word in anagramMap.words) {
        if (word.charAt(column) === char) {
          matches.push(word)
        }
      }

      return matches
    }
  }

  function showFlip() {
    links.push("#egg")
    var targets = [
      ["#egg","#egg","#N","#E","#A","#T","#egg","#egg"]
    , ["#egg","#egg","#egg","#egg","#egg","#egg","#egg","#egg"]
    , ["#egg","#egg","#egg","#egg","#egg","#egg","#egg","#egg"]
    , ["#egg","#G","#R","#E","#A","#T","#!","#egg"]
    ]
    var gs = document.querySelectorAll("#anagrams g")
    var order = [0,1,2,3]

    ;(function flipWhite(){
      setSquaresDraggable(false)
      portalSquare.classList.add("flip")

      var eggs = document.querySelectorAll("#anagram use")
      eggs = [].slice.call(eggs)
      var total = eggs.length
      var ii
      
      for (ii = 0; ii < total; ii += 1) {
        new Flip(eggs[ii], "#egg")
      }      
    })()

    setTimeout(showNeatGreat, 500)

    function showNeatGreat() {
      var index = getRandom(order, 4, "dontRecycle")
      var g = gs[index]
      var links = targets[index]
      var eggs = g.querySelectorAll("use")
      
      var total = eggs.length
      var ii
      for (ii = 0; ii < total; ii += 1) {
        new Flip(eggs[ii], links[ii])
      }

      if (order.length) {
        setTimeout(showNeatGreat, 500)
      } else {
        setTimeout(fadeEggs, 1000)
        setTimeout(goEaster, 3000)
      }
    }

    function fadeEggs() {
      portalSquare.classList.add("drop")
    }

    function goEaster() {
      setState("easter")
    }
  }


  /* EASTER EASTER EASTER EASTER EASTER EASTER EASTER EASTER EASTER */

  function startEaster() {
    portalSquare.classList.add("fullwidth", "drop", "flip")

    var targets = [
      ["#egg","#egg","#N","#E","#A","#T","#egg","#egg"]
    , ["#egg","#egg","#egg","#egg","#egg","#egg","#egg","#egg"]
    , ["#egg","#egg","#egg","#egg","#egg","#egg","#egg","#egg"]
    , ["#egg","#G","#R","#E","#A","#T","#!","#egg"]
    ]
    var sourceArray = [1,2,4,8,16,32,64,128,256,512,1024]
    var dropArray = sourceArray.slice(0)
    var gs = document.querySelectorAll("#anagrams g")
    var keyhole = document.querySelector("#keyhole")
    var squares = document.querySelectorAll('.square:not(.portal)')
    var total
      , ii
      , transform

    checkList.length = 0

    ;(function moveSquaresToAnagram(){
      total = squares.length

      for (ii = 0; ii < total; ii += 1) {
        anagram.appendChild(squares[ii])
      }
    })()

    ;(function setNeatGreat(){
      var g
        , eggs
        , eggCount
        , jj
        , links

      total = gs.length
      
      for (ii = 0; ii < total; ii += 1) {
        g = gs[ii]
        eggs = g.querySelectorAll("use")
        links = targets[ii]

        eggCount = eggs.length     
        for (jj = 0; jj < eggCount; jj += 1) {
          eggs[jj].setAttribute("xlink:href", links[jj])
        }
      }
    })()

    ;(function animateKeyhole() {
      //var selector = "#anagrams g:nth-child(3) use:nth-child(7)"
      var regPoint = " 1420 285)"
      var angles = [1,2,4,8,16,32,64,128,192,170,185,180]
      var angle

      ;(function rotateKeyHole(){
        angle = angles.shift()
        transform = "rotate(" + angle + regPoint
        keyhole.setAttribute("transform", transform)
        if (angles.length) {
          setTimeout(rotateKeyHole, 66)
        } else {
          setTimeout(dropKeyhole, 1000)
        }
      })()
    })()

    function dropKeyhole() {
      var offset = transform + " translate(0 -"+dropArray.shift()+")"
      keyhole.setAttribute("transform", offset)
      if (dropArray.length) {
        setTimeout(dropKeyhole, 66)
      } else {
        setTimeout(dropEggs, 1000)
      }     
    }

    function dropEggs() {
      var selector = "#anagrams g:nth-child(4)"
      var dragSource = document.querySelector(selector)
      selector = "#anagrams g:nth-child(1)"
      var neat = document.querySelector(selector)
      neat = [].slice.call(neat.querySelectorAll("use"))
      neat.splice(6, 2)
      neat.splice(0, 2)
      var neeg = ["#N","#E","#E","#G"]
      
      selector = "#anagrams g:nth-child(4)"
      var great = document.querySelector(selector)
      great = [].slice.call(great.querySelectorAll("use"))
      great.splice(6, 2)
      great.shift()

      var total = neat.length
      var ii
        , egg
      
      for (ii = 0; ii < total; ii += 1) {
        egg = neat[ii]
        new EggDrop(egg, 950, fallen, neeg[ii])
        egg.classList.add("draggable")
      }

      total = great.length      
      for (ii = 0; ii < total; ii += 1) {
        egg = great[ii]
        new EggDrop(egg, 350, fallen)
        egg.classList.add("draggable")
      }
      
      total = 9
      function fallen() {
        total -= 1
        if (!total) {
          showEasterEggSlots()
        }
      } 

      function EggDrop(egg, height, callback, link) {
        var delay = Math.floor(Math.random() * 2000)
        var dropArray = sourceArray.slice(0)
        var transform

        setTimeout(drop, delay)

        function drop() {
          var offset = dropArray.shift()
          if (offset < height) {
            setTimeout(drop, 66)

          } else {
            offset = height

            if (link) {
              // NEAT egg. Move it to last g and set its letter
              egg.setAttribute("xlink:href", link)
              dragSource.appendChild(egg)
              offset = 350
            }
            callback()
          }

          transform = "translate(0 "+ offset +")"
          egg.setAttribute("transform", transform)        
        }
      }     
    }

    function showEasterEggSlots(){
      var selector = "#anagrams g:nth-child(2)"
      var easterSlots = document.querySelector(selector)
      easterSlots = [].slice.call(easterSlots.querySelector("use"))
      easterSlots.pop()
      easterSlots.shift()
      
      selector = "#anagrams g:nth-child(3)"
      var eggRow = document.querySelector(selector)
      eggSlots = [].slice.call(eggRow.querySelector("use"))
      eggSlots.shift()
      eggSlots.splice(4,4)
      eggRow.setAttribute("transform", "translate(315 600)")

      portalSquare.classList.add("easter")
    } 
  }

  function startEasterDrag(dragData, egg) {
    var link = egg.getAttribute("xlink:href")
    var transform = egg.getAttribute("transform") // "translate(x y)"
    var regex = /translate\((-?\d+\.?\d*)\s(-?\d+\.?\d*)/
    transform = transform.match(regex)
    // ["translate(0 350", "0", "350"]
    var transformX = parseFloat(transform[1], 10)
    var transformY = parseFloat(transform[2], 10)
    var startX = dragData.loc.x
    var startY = dragData.loc.y
    var scale = eggWidth / egg.getBoundingClientRect().width
    var swap = []
    var start = + new Date()

    switch (link) {
      case "#A":
      case "#T":
        swap = [link]
      break
      case "#E":
      case "#3":
        swap = ["#E", "#3"]
      break
      case "#N":
      case "#И":
        swap = ["#N", "#И"]
      break
      case "#R":
      case "#Я":
        swap = ["#R", "#Я"]
      break
      case "#G":
      case "#J":
        swap = ["#G", "#J"]
      break
    }

    link = swap[0] // Ensure link is a droppable letter

    // Override generic move and stop
    body.onmousemove = body.ontouchmove = drag
    body.onmouseup = body.ontouchend = stopDrag

    function drag(event) {
      clientLoc = getClientLoc(event)

      var newX = transformX + (clientLoc.x - startX) * scale
      var newY = transformY+ (clientLoc.y - startY) * scale
      var transform = "translate(" + newX + " " + newY + ")"
      egg.setAttribute("transform", transform)

      if (+ new Date() > (start + 100)) {
        var link = swap.pop() // Local value for the wiggle
        start = + new Date()
        if (link) {
          swap.unshift(link)
          egg.setAttribute("xlink:href", link)
        }
      }
    }

    function stopDrag(event) {
      body.onmousemove = body.ontouchmove = body.onmouseup = body.ontouchend = null

      clientLoc = getClientLoc(event)

      egg.setAttribute("xlink:href", link)
      egg.style.display = "none" 
      var element=document.elementFromPoint(clientLoc.x, clientLoc.y)
      egg.style.display = ""

      if (element.tagName.toLowerCase() === "use") {
        checkForCharDrop(element, egg, link)
      } else {        
        dropEgg(egg, 0)
      }

      function checkForCharDrop(element, egg, link) {
        var column = getElementIndex(element)
        var row = getElementIndex(element.parentNode)
        var expected = easter[row][column]

        if (expected && !element.classList.contains("placed")) {
          attachEggToTarget(element, egg, link, expected)
        } else {
          dropEgg(egg, 0, "dontResetElement")
        }
      }

      function attachEggToTarget(element, egg, link, expected) {
        egg.classList.add("placed")
        element.classList.add("placed")
        element.setAttribute("xlink:href", link)

        if (link === expected) {
          checkList.push(0)
          if (expected === "#N") {
            element.setAttribute("xlink:href", "#И")
          }
          if (checkList.length === 9) {
            showDone()
          }
        } else {
          dropEgg(egg, Math.floor(Math.random() * 1000))
        }
      }

      function dropEgg(egg, delay, dontResetElement) {
        var transformX
        var transformY
        var dropArray

        transform = egg.getAttribute("transform")
        transform = transform.match(regex)
        transformX = parseFloat(transform[1])
        transformY = parseFloat(transform[2])
        dropArray = [1,2,4,8,16,32,64,128,256,512,1024]
        setTimeout(startDrop, delay)

        function startDrop() {
          if (!dontResetElement) {
            element.classList.remove("placed")
            element.setAttribute("xlink:href", "#egg")
          }

          egg.classList.remove("placed")
          drop()
        }
        
        function drop(){
          var offset = Math.min(dropArray.shift()+transformY, 350)
          var t ="translate(" + transformX +" "+ offset +")"
          egg.setAttribute("transform", t)

          if (dropArray.length) {
            setTimeout(drop, 33)
          }
        }
      }
    }
  }

  function stopEasterDrag(dragData, overPortal, event) {
    setTimeout(showDone, 500)
  }

  function showDone() {
    var eggS = document.querySelector("#tip")
    var regPoint = " 790 200)"
    var angles = [1,2,4,8,16,32,64,90]
    var angle

    ;(function tip(){
      angle = angles.shift()
      transform = "rotate(" + angle + regPoint
      eggS.setAttribute("transform", transform)
      if (angles.length) {
        setTimeout(tip, 66)
      } else {
        localStorage.setItem("state", "hunt")
        setTimeout(showKiwi, 1000)
      }
    })()

    function showKiwi() {
      var img = document.querySelector("img")
      img.classList.remove("hidden")
    }
  }


  /* FLIP FLIP FLIP FLIP FLIP FLIP FLIP FLIP FLIP FLIP FLIP FLIP */

  function Flip(egg, target) {
    var link = egg.getAttribute("xlink:href")
    var index = links.indexOf(link)
    var total = links.length

    ;(function flip(){
      index = (index + 1) % total
      link = links[index]
      egg.setAttribute("xlink:href", link)
      if (link !== target) {
        setTimeout(flip, 100)
      }
    })()
  }

  /* UTILITIES */

  function randomItem(array) {
    var total = array.length
    var index = Math.floor(Math.random() * total)
    return array[index]    
  }

  function getRandom(array, maxIndex, dontRecycle) {
    maxIndex = Math.min(array.length, maxIndex)
    var random = Math.floor(Math.random() * maxIndex)
    var value = array.splice(random, 1)[0]

    if (!dontRecycle) {
      array.push(value)
    }

    return value
  }

  function removeItemFromArray(array, item) {
    cut = array.indexOf(item)
    if (cut > -1) {
      array.splice(cut, 1)
    }
  }

  function getElementIndex(element) {
    var index = -1

    while (element) {
      index += 1
      element = element.previousElementSibling;
    }

    return index
  }

  function getSiblings(element, filter) {
    var siblings = []
    element = element.parentNode.firstChild

    do {
      if (!filter || filter(element)) siblings.push(element)
    } while (element = element.nextSibling)

    return siblings;
  }

  function removeSizeNClass(target) {
    target.classList.remove(
      "size-0"
    , "size-1"
    , "size-2"
    , "size-3"
    , "size-4"
    , "size-5"
    , "size-6"
    , "size-7"
    )
  }

  function compareArrays (array1, array2) {
    var total = array1.length
    var ii

    if (array2.length !== total) {
      return false
    }

    for (ii = 0; ii < total; ii += 1) {
      if (array1[ii] !== array2[ii]) { 
        return false;   
      }           
    }       
    return true;
  }
})()
